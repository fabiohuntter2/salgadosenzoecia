<title>Salgados Enzo e Cia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<style id="css">
/* Layout: coluna única estilo cardápio de celular, faixa de pedido presa no rodapé */
:root{
  --bg:#1d0d08; --surface:#2b140d; --surface2:#3a1b11; --line:#55301f;
  --fg:#fff4e6; --mut:#dcbfa6; --red:#e3262b; --yellow:#ffd21f; --green:#1fae55; --ink:#1d0d08;
  --display:"Lilita One","Arial Black",Impact,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:0 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));}
.hero img{display:block;width:100%;height:auto}
.selos{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.selo{background:var(--surface2);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800}
.selo b{color:var(--yellow)}
h2{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.3px;margin:22px 0 10px;color:var(--yellow);text-wrap:balance}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}
.prod img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;max-width:100%}
.pbody{padding:14px 16px 16px;display:grid;gap:10px}
.ptop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ptop h3{margin:0;font-size:19px;font-weight:900;line-height:1.2;min-width:0}
.preco{font-family:var(--display);font-size:26px;color:var(--fg);background:var(--red);border-radius:12px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.desc{margin:0;color:var(--mut);font-size:15px}
.linha{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.linha span{min-width:0;font-weight:700}
.step{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.step button{width:40px;height:40px;border-radius:12px;border:0;font-size:22px;font-weight:900;cursor:pointer;background:var(--surface2);color:var(--fg)}
.step button.mais{background:var(--yellow);color:var(--ink)}
.step output{min-width:26px;text-align:center;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.nota{color:var(--mut);font-size:14px;margin:6px 0 0}
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--red);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -6px 24px rgba(0,0,0,.4);z-index:5}
.barra .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.barra .tot{flex:1;min-width:0}
.barra small{display:block;font-weight:800;opacity:.9}
.barra strong{font-family:var(--display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.cta{border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:900;cursor:pointer;background:var(--yellow);color:var(--ink);text-decoration:none;display:inline-block;text-align:center}
.cta:disabled{opacity:.45;cursor:not-allowed}
.cta.zap{background:var(--green);color:#fff;width:100%}
.painel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;margin-top:8px}
label{font-weight:800;font-size:14px;color:var(--mut);display:grid;gap:5px}
input,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.opc{display:flex;gap:8px;flex-wrap:wrap}
.opc label{flex:1;min-width:130px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--fg);cursor:pointer}
.opc input{width:auto}
.resumo{display:grid;gap:4px;font-size:15px}
.resumo{width:100%;text-align:left}
.resumo div{display:flex;justify-content:space-between;gap:10px}
.resumo div span:first-child{min-width:0}
.resumo div span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.resumo .t{font-weight:900;font-size:19px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.pix{display:grid;justify-items:center;gap:10px;text-align:center}
.pix canvas{background:#fff;border-radius:16px;padding:12px;width:240px;max-width:100%;height:auto}
.codigo{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;text-align:left;width:100%;user-select:all}
.sec{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.passos{margin:0;padding-left:20px;color:var(--mut);font-size:14px;text-align:left}
.zapnum{font-weight:900;color:var(--fg);user-select:all}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--fg);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
/* modo dono */
.dono-btn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:6;border:0;border-radius:999px;padding:9px 14px;font-weight:900;background:var(--yellow);color:var(--ink);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.ed{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.ed .row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px}
.ed .acoes{display:flex;gap:8px;flex-wrap:wrap}
.ed .acoes button,.mini{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;color:var(--fg)}
.adm-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface2);border-bottom:2px solid var(--yellow);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px}
.adm-bar .in{max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;border-radius:9px;padding:8px 12px;font:inherit;font-size:14px;font-weight:900;cursor:pointer;background:transparent;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.estado{font-size:13px;font-weight:800;color:var(--mut)}
.estado.pend{color:var(--yellow)}
.previa{font-size:14px;font-weight:700}
.previa span{min-width:0;flex:1}
.mini.pub{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.cta.sec:disabled,.cta:disabled{opacity:.45}
.chk input{width:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="toast" id="toast" role="status"></div>

<script id="main">
const HEAD_HTML = '<title>Salgados Enzo e Cia</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">\n';
const PUB = JSON.parse(document.getElementById("dados").textContent); // versão que está no ar
let D = PUB;      // o que está sendo mostrado
let R = null;     // rascunho do dono (só existe no aparelho do dono)
const clone = o => JSON.parse(JSON.stringify(o));
function carregaRascunho(){ try{ const t=localStorage.getItem("enzoRascunhoAdm"); if(t) return JSON.parse(t); }catch(e){} return clone(PUB); }
function guardaRascunho(){ try{ localStorage.setItem("enzoRascunhoAdm", JSON.stringify(R)); }catch(e){} }
const temMudanca = () => !!R && JSON.stringify(R)!==JSON.stringify(PUB);
const carrinho = {}; // "id|sabor" -> qtd
const st = { etapa:"cardapio", nome:"", modo:"entrega", end:"", obs:"", dono:false, adm:false, descartar:false };
try { Object.assign(st, JSON.parse(sessionStorage.getItem("enzoRascunho")||"{}"), {etapa:"cardapio"}); } catch(e){}
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reais = n => "R$ " + Number(n||0).toFixed(2).replace(".",",");
const num = v => { const n=parseFloat(String(v||"").replace(/\s/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".")); return isNaN(n)?0:n; };

/* ---------- Pix (BR Code) ---------- */
const semAcento = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9 .\-@]/g,"").trim();
const tlv = (id,v) => id + String(v.length).padStart(2,"0") + v;
function crc16(str){ let c=0xFFFF; for(let i=0;i<str.length;i++){ c^=str.charCodeAt(i)<<8; for(let j=0;j<8;j++) c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF; } return c.toString(16).toUpperCase().padStart(4,"0"); }
function pixPayload(valor){
  const p = tlv("00","01") + tlv("26", tlv("00","br.gov.bcb.pix") + tlv("01", D.pix.chave))
    + tlv("52","0000") + tlv("53","986") + (valor>0 ? tlv("54", valor.toFixed(2)) : "")
    + tlv("58","BR") + tlv("59", semAcento(D.pix.nome).toUpperCase().slice(0,25)) + tlv("60", semAcento(D.pix.cidade).toUpperCase().slice(0,15))
    + tlv("62", tlv("05","***")) + "6304";
  return p + crc16(p);
}

/* ---------- carrinho ---------- */
function itens(){
  const out=[];
  for(const p of D.produtos){ if(!p.ativo) continue;
    const linhas = p.sabores.length ? p.sabores : [""];
    for(const s of linhas){ const q=carrinho[p.id+"|"+s]||0; if(q>0) out.push({p, s, q, sub:q*p.preco}); } }
  return out;
}
const total = () => itens().reduce((a,i)=>a+i.sub,0);
const qtdTotal = () => itens().reduce((a,i)=>a+i.q,0);
function muda(chave,d){ carrinho[chave]=Math.max(0,(carrinho[chave]||0)+d); render(); }

/* ---------- telas ---------- */
function telaCardapio(){
  const prods = D.produtos.filter(p=>p.ativo).map(p=>{
    const linhas = p.sabores.length ? p.sabores : [""];
    return `<article class="prod">
      ${p.foto?`<img src="${p.foto}" alt="${esc(p.nome)}">`:""}
      <div class="pbody">
        <div class="ptop"><h3>${esc(p.nome)}</h3><span class="preco">${reais(p.preco)}</span></div>
        ${p.desc?`<p class="desc">${esc(p.desc)}</p>`:""}
        ${p.sabores.length?`<p class="nota" style="margin:0">Escolha o sabor:</p>`:""}
        ${linhas.map(s=>{ const k=p.id+"|"+s; const q=carrinho[k]||0; return `<div class="linha"><span>${s?esc(s):"Quantidade"}</span>
          <div class="step"><button data-k="${esc(k)}" data-d="-1" aria-label="Remover um">−</button><output>${q}</output><button class="mais" data-k="${esc(k)}" data-d="1" aria-label="Adicionar um">+</button></div></div>`; }).join("")}
      </div></article>`;
  }).join("");
  return `<div class="hero"><img src="${D.loja.capa}" alt="${esc(D.loja.nome)}"></div>
    <div class="selos"><span class="selo">🛵 ${esc(D.loja.entrega)}</span><span class="selo">💠 Pague no <b>Pix</b></span><span class="selo">📲 ${esc(D.loja.zapTexto)}</span></div>
    <h2>Monte seu pedido</h2>${prods}
    <p class="nota">${esc(D.loja.aviso)}</p>`;
}
function resumoHtml(){
  return `<div class="resumo">${itens().map(i=>`<div><span>${i.q}× ${esc(i.p.nome)}${i.s?` <small>(${esc(i.s)})</small>`:""}</span><span>${reais(i.sub)}</span></div>`).join("")}
    <div class="t"><span>Total</span><span>${reais(total())}</span></div></div>`;
}
function telaDados(){
  return `<h2>Seus dados</h2><form class="painel" id="form">
    ${resumoHtml()}
    <label>Seu nome<input id="f-nome" required value="${esc(st.nome)}" autocomplete="name"></label>
    <div class="opc"><label><input type="radio" name="modo" value="entrega" ${st.modo==="entrega"?"checked":""}> Entrega</label><label><input type="radio" name="modo" value="retirada" ${st.modo==="retirada"?"checked":""}> Vou buscar</label></div>
    <label ${st.modo==="retirada"?"hidden":""} id="l-end">Endereço completo<textarea id="f-end" rows="2">${esc(st.end)}</textarea></label>
    <label>Observação (opcional)<input id="f-obs" value="${esc(st.obs)}" placeholder="Ex.: troco para R$ 50, ponto de referência"></label>
    <button class="cta" type="submit">Ir para o pagamento no Pix</button>
    <button class="cta sec" type="button" id="voltar">Voltar ao cardápio</button>
  </form>`;
}
function mensagem(pix){
  const ls = itens().map(i=>`• ${i.q}x ${i.p.nome}${i.s?` (${i.s})`:""} — ${reais(i.sub)}`).join("\n");
  return `*Pedido — ${D.loja.nome}*\n\n${ls}\n\n*Total: ${reais(total())}*\n\nNome: ${st.nome}\n${st.modo==="entrega"?`Endereço de entrega: ${st.end}`:"Retirada no local"}${st.obs?`\nObs.: ${st.obs}`:""}\n\nPagamento: Pix. Envio o comprovante em seguida.`;
}
function telaPix(){
  const v=total(), pix=pixPayload(v);
  const link="https://wa.me/"+D.loja.zap+"?text="+encodeURIComponent(mensagem(pix));
  return `<h2>Pague no Pix</h2><div class="painel pix">
    ${resumoHtml()}
    <canvas id="qr" width="600" height="600" aria-label="QR Code Pix de ${reais(v)}"></canvas>
    <ol class="passos"><li>Abra o app do seu banco e escolha <b>Pix › Ler QR Code</b> ou cole o código abaixo em <b>Pix Copia e Cola</b>.</li><li>O valor de <b>${reais(v)}</b> já vem preenchido. Recebedor: ${esc(D.pix.nome)}.</li><li>Depois, toque em <b>Enviar pedido no WhatsApp</b> e envie o comprovante.</li></ol>
    <div class="codigo" id="cod">${esc(pix)}</div>
    <button class="cta" id="copiar" type="button" style="width:100%">Copiar código Pix</button>
    <a class="cta zap" href="${link}" target="_blank" rel="noopener">Enviar pedido no WhatsApp</a>
    <p class="nota">Se o WhatsApp não abrir, chame a gente no número <span class="zapnum">${esc(D.loja.zapTexto)}</span>.</p>
    <button class="cta sec" type="button" id="voltar" style="width:100%">Alterar pedido</button>
  </div>`;
}
function barra(){
  if(st.etapa!=="cardapio") return "";
  const q=qtdTotal();
  return `<div class="barra"><div class="in"><div class="tot"><small>${q?`${q} ${q>1?"itens":"item"} no pedido`:"Escolha seus combos"}</small><strong>${reais(total())}</strong></div>
    <button class="cta" id="fechar" ${q?"":"disabled"}>Fazer pedido</button></div></div>`;
}

/* ---------- modo dono ---------- */
function barraDono(){
  const m=temMudanca();
  return `<div class="adm-bar"><div class="in">
    <div class="seg"><button type="button" id="m-adm" aria-pressed="${st.adm}">⚙️ Modo ADM</button><button type="button" id="m-cli" aria-pressed="${!st.adm}">👁️ Modo cliente</button></div>
    <span class="estado ${m?"pend":""}" id="estado">${m?"Rascunho não publicado":"Tudo publicado"}</span></div>
    ${!st.adm&&m?`<div class="in previa"><span>Prévia: é assim que o cliente verá depois que você publicar.</span><button type="button" class="mini pub" id="pubPrevia">Publicar agora</button></div>`:""}
  </div>`;
}
function telaDono(){
  return `<h2>Modo ADM</h2><div class="painel">
    <p class="nota" style="margin:0">Só você vê esta área. Suas alterações ficam salvas como <b>rascunho</b> neste aparelho e <b>só aparecem para os clientes</b> depois que você tocar em <b>Publicar agora</b>. Use o <b>Modo cliente</b> para conferir antes.</p>
    ${R.produtos.map((p,i)=>`<div class="ed" data-i="${i}">
      <label>Nome<input data-f="nome" value="${esc(p.nome)}"></label>
      <div class="row"><label>Descrição<input data-f="desc" value="${esc(p.desc)}"></label><label>Preço<input data-f="preco" inputmode="decimal" value="${String(p.preco.toFixed(2)).replace(".",",")}"></label></div>
      <label>Sabores (separados por vírgula; deixe em branco se não houver)<input data-f="sabores" value="${esc(p.sabores.join(", "))}"></label>
      <div class="acoes"><label class="chk"><input type="checkbox" data-f="ativo" ${p.ativo?"checked":""}> Mostrar no cardápio</label>
        <label class="mini">Trocar foto<input type="file" accept="image/*" data-foto="${i}" hidden></label>
        <button type="button" data-del="${i}">Remover</button></div>
    </div>`).join("")}
    <button type="button" class="mini" id="novo">+ Novo produto</button>
    <label>Aviso no final do cardápio<input id="e-aviso" value="${esc(R.loja.aviso)}"></label>
    <button class="cta" type="button" id="verCliente">👁️ Ver prévia do cliente</button>
    <button class="cta" type="button" id="publicar" ${temMudanca()?"":"disabled"}>Publicar agora</button>
    <button class="cta sec" type="button" id="descartar" ${temMudanca()?"":"disabled"}>${st.descartar?"Toque de novo para confirmar":"Descartar alterações"}</button>
  </div>`;
}
function lerEditor(){
  if(!$(".ed")&&!$("#e-aviso")) return;
  document.querySelectorAll(".ed").forEach(el=>{ const p=R.produtos[+el.dataset.i];
    el.querySelectorAll("[data-f]").forEach(inp=>{ const f=inp.dataset.f;
      if(f==="preco") p.preco=num(inp.value); else if(f==="ativo") p.ativo=inp.checked;
      else if(f==="sabores") p.sabores=inp.value.split(",").map(s=>s.trim()).filter(Boolean); else p[f]=inp.value.trim(); }); });
  R.loja.aviso=$("#e-aviso").value.trim();
  guardaRascunho();
}
function atualizaEstado(){
  const m=temMudanca(), e=$("#estado"); if(e){ e.textContent=m?"Rascunho não publicado":"Tudo publicado"; e.classList.toggle("pend",m); }
  const p=$("#publicar"); if(p) p.disabled=!m; const d=$("#descartar"); if(d) d.disabled=!m;
}
function documento(){
  const reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}';
  const json=JSON.stringify(R).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    + HEAD_HTML + '<style id="css">'+document.getElementById("css").textContent+'</style>\n<div id="app"></div>\n<div class="toast" id="toast" role="status"></div>\n'
    + '<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></'+'script>\n'
    + '<script type="application/json" id="dados">'+json+'</'+'script>\n<script id="main">'+document.getElementById("main").textContent+'</'+'script>\n</body></html>';
}
async function publicar(btn){
  lerEditor(); const txt=btn.textContent; btn.disabled=true; btn.textContent="Publicando…";
  try{ const a=window.claude?.use ? await claude.use("artifact") : null; if(!a) throw {code:"sem_claude"}; await a.publish(documento()); toast("Publicado! Os clientes já veem o novo cardápio."); }
  catch(e){ btn.disabled=false; btn.textContent=txt;
    toast(e&&e.code==="sem_claude" ? "Para publicar, abra este link pelo Claude (app ou claude.ai) com a sua conta. O rascunho continua salvo." : e&&e.code==="conflict" ? "Outra versão foi salva antes. A página vai recarregar." : (e&&(e.code==="not_writer"||e.code==="not_granted")) ? "Sua conta não tem permissão para editar o cardápio." : "Não foi possível publicar agora. Tente novamente em instantes."); }
}
function fotoArquivo(i,f){
  const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement("canvas"), s=Math.min(1,900/im.width);
    c.width=im.width*s; c.height=im.height*s; c.getContext("2d").drawImage(im,0,0,c.width,c.height); lerEditor(); R.produtos[i].foto=c.toDataURL("image/jpeg",.82); guardaRascunho(); render(); toast("Foto alterada no rascunho."); }; im.src=r.result; }; r.readAsDataURL(f);
}

/* ---------- render ---------- */
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),t.length>60?5500:2600); }
function salvarRascunho(){ try{ sessionStorage.setItem("enzoRascunho", JSON.stringify({nome:st.nome,modo:st.modo,end:st.end,obs:st.obs})); }catch(e){} }
function render(){
  if(st.dono) D = R; // o dono vê o rascunho na prévia
  const adm = st.dono && st.adm;
  const tela = adm ? telaDono() : st.etapa==="dados" ? telaDados() : st.etapa==="pix" ? telaPix() : telaCardapio();
  $("#app").innerHTML = `${st.dono?barraDono():""}<div class="wrap">${tela}</div>${adm?"":barra()}`;
  ligar();
}
function ligar(){
  document.querySelectorAll(".step button").forEach(b=>b.onclick=()=>muda(b.dataset.k,+b.dataset.d));
  const f=$("#fechar"); if(f) f.onclick=()=>{ st.etapa="dados"; render(); scrollTo(0,0); };
  const v=$("#voltar"); if(v) v.onclick=()=>{ st.etapa="cardapio"; render(); };
  const form=$("#form");
  if(form){
    form.querySelectorAll('input[name=modo]').forEach(r=>r.onchange=()=>{ st.modo=r.value; $("#l-end").hidden = st.modo==="retirada"; });
    form.onsubmit=e=>{ e.preventDefault(); st.nome=$("#f-nome").value.trim(); st.end=$("#f-end").value.trim(); st.obs=$("#f-obs").value.trim();
      if(!st.nome) return toast("Informe seu nome para sabermos de quem é o pedido.");
      if(st.modo==="entrega"&&!st.end) return toast("Informe o endereço de entrega ou escolha “Vou buscar”.");
      salvarRascunho(); st.etapa="pix"; render(); scrollTo(0,0); };
  }
  const qr=$("#qr");
  if(qr && window.qrcode){ const pix=pixPayload(total()); const q=qrcode(0,"M"); q.addData(pix); q.make();
    const n=q.getModuleCount(), ctx=qr.getContext("2d"), cel=600/n; ctx.fillStyle="#fff"; ctx.fillRect(0,0,600,600); ctx.fillStyle="#000";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) ctx.fillRect(c*cel,r*cel,Math.ceil(cel),Math.ceil(cel)); }
  const cp=$("#copiar");
  if(cp) cp.onclick=()=>{ const t=$("#cod").textContent;
    navigator.clipboard.writeText(t).then(()=>toast("Código Pix copiado! Cole no app do banco.")).catch(()=>{ const r=document.createRange(); r.selectNodeContents($("#cod")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Código selecionado. Use a opção Copiar do celular."); }); };
  if(st.dono){
    $("#m-adm").onclick=()=>{ st.adm=true; st.descartar=false; render(); scrollTo(0,0); };
    $("#m-cli").onclick=()=>{ lerEditor(); st.adm=false; st.etapa="cardapio"; render(); scrollTo(0,0); };
    const pp=$("#pubPrevia"); if(pp) pp.onclick=e=>publicar(e.currentTarget);
  }
  if(st.dono && st.adm){
    document.querySelectorAll(".ed input:not([type=file]), #e-aviso").forEach(inp=>{ inp.oninput=inp.onchange=()=>{ lerEditor(); atualizaEstado(); }; });
    $("#verCliente").onclick=()=>{ lerEditor(); st.adm=false; st.etapa="cardapio"; render(); scrollTo(0,0); };
    $("#publicar").onclick=e=>publicar(e.currentTarget);
    $("#descartar").onclick=()=>{ if(!st.descartar){ st.descartar=true; render(); return; }
      st.descartar=false; R=clone(PUB); try{ localStorage.removeItem("enzoRascunhoAdm"); }catch(e){} render(); toast("Rascunho descartado. A versão publicada foi restaurada."); };
    $("#novo").onclick=()=>{ lerEditor(); R.produtos.push({id:"p"+Date.now().toString(36),nome:"Novo produto",desc:"",preco:0,foto:"",sabores:[],ativo:true}); guardaRascunho(); render(); };
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ lerEditor(); R.produtos.splice(+b.dataset.del,1); guardaRascunho(); render(); });
    document.querySelectorAll("[data-foto]").forEach(inp=>inp.onchange=()=>inp.files[0]&&fotoArquivo(+inp.dataset.foto,inp.files[0]));
  }
}
function entrarComoDono(){ if(st.dono) return; R=carregaRascunho(); st.dono=true; st.adm=true; render(); scrollTo(0,0); }
render();
// Entrada do dono: automática quando o Claude reconhece a conta dona, ou pelo endereço com #adm no final.
if(location.hash==="#adm") entrarComoDono();
addEventListener("hashchange",()=>{ if(location.hash==="#adm") entrarComoDono(); });
(async()=>{ try{ const u=await window.claude?.use?.("user"); if(u && ((await u.isOwner()) || (await u.canEdit()))) entrarComoDono(); }catch(e){} })();
</script>
